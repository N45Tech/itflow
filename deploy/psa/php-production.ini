display_errors = Off
log_errors = On
error_log = /proc/self/fd/2
expose_php = Off
memory_limit = 512M
max_execution_time = 300
max_input_time = 300
upload_max_filesize = 500M
post_max_size = 500M
session.cookie_httponly = 1
session.cookie_secure = 1
session.cookie_samesite = Lax
session.use_strict_mode = 1
