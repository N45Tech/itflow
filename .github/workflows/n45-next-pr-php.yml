name: N45 Next PR PHP Checks

on:
  pull_request:
    branches:
      - next

permissions:
  contents: read

jobs:
  php-contracts:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout proposed merge
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.3'
          extensions: mysqli, intl, mbstring
          coverage: none

      - name: Validate PHP syntax
        run: |
          set -euo pipefail
          while IFS= read -r -d '' php_file; do
            php -l "$php_file" > /dev/null
          done < <(git ls-files -z '*.php')

      - name: Run PHP regression contracts
        run: |
          set -euo pipefail
          for test_file in tests/*_test.php; do
            php "$test_file"
          done

  database-acceptance:
    runs-on: ubuntu-24.04
    env:
      N45_CI_DB_HOST: 127.0.0.1
      N45_CI_DB_PORT: '3306'
      N45_CI_DB_USER: root
      N45_CI_DB_PASSWORD: n45-ci-root-password
    services:
      mariadb:
        image: mariadb:11.4
        ports:
          - '3306:3306'
        env:
          MARIADB_ROOT_PASSWORD: n45-ci-root-password
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3
    steps:
      - name: Checkout proposed merge with release history
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.3'
          extensions: mysqli, intl, mbstring
          coverage: none

      - name: Install MariaDB client
        run: |
          sudo apt-get update
          sudo apt-get install --yes mariadb-client

      - name: Install Playwright Chromium
        run: |
          npm install --prefix "$RUNNER_TEMP/n45-field-browser" --no-save --ignore-scripts playwright@1.62.1
          "$RUNNER_TEMP/n45-field-browser/node_modules/.bin/playwright" install --with-deps chromium

      - name: Validate generated n8n workflows
        run: |
          node deploy/n8n/build-workflows.mjs
          node deploy/n8n/test-workflows.mjs
          git diff --exit-code -- deploy/n8n/workflows

      - name: Exercise database upgrade, browser and lock-order contracts
        env:
          MYSQL_PWD: n45-ci-root-password
          N45_ASSISTANCE_BROWSER: '1'
          NODE_PATH: ${{ runner.temp }}/n45-field-browser/node_modules
        run: |
          bash tests/n45_release_database_test.sh
          bash tests/n45_lock_order_database_test.sh
