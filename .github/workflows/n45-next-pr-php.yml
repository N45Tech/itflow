name: N45 Next PR PHP Checks

on:
  pull_request:
    branches:
      - next

permissions:
  contents: read

jobs:
  php-contracts:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout proposed merge
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.3'
          extensions: mysqli, intl, mbstring
          coverage: none

      - name: Validate PHP syntax
        run: |
          set -euo pipefail
          while IFS= read -r -d '' php_file; do
            php -l "$php_file" > /dev/null
          done < <(git ls-files -z '*.php')

      - name: Run PHP regression contracts
        run: |
          set -euo pipefail
          for test_file in tests/*_test.php; do
            php "$test_file"
          done
