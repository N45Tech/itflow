name: Consolidate investigation rollout
on:
  push:
    branches: [codex/automation-investigator]
    paths: [.github/workflows/investigation-consolidate.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mysqli, mbstring, intl, curl
          coverage: none
      - name: Integrate original ticket styling, shared model validation and canonical rollout docs
        env:
          PATCH_B64: ''
        run: |
          set -euo pipefail
          printf '%s' "$PATCH_B64" | base64 --decode | xz --decompress > "$RUNNER_TEMP/consolidation.patch"
          echo "f47dd23e0ddc0261d21fc98dc557100a62edc3c9cdd8cc38dda642c632845ca0  $RUNNER_TEMP/consolidation.patch" | sha256sum --check
          git apply --check "$RUNNER_TEMP/consolidation.patch"
          git apply "$RUNNER_TEMP/consolidation.patch"
          git diff --check
          for file in tests/*_test.php; do php "$file"; done
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add agent/ticket.php agent/includes/ticket_investigation.php DESIGN.md deploy/n8n/README.md docs/n45/automation-investigator.md tests/ai_use_case_test.php
          git commit -m 'feat: consolidate read-only investigation UI and rollout documentation'
          git push origin HEAD:refs/heads/codex/automation-investigator
