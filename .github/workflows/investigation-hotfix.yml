name: Apply investigation validation fix
on:
  push:
    branches: [codex/read-only-ticket-investigation]
    paths: [.github/workflows/investigation-hotfix.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mysqli, mbstring, intl, curl
          coverage: none
      - name: Apply reviewed checksum-bound correction
        env:
          PATCH_B64: ''
        run: |
          set -euo pipefail
          printf '%s' "$PATCH_B64" | base64 --decode | xz --decompress > "$RUNNER_TEMP/fix.patch"
          echo "a57397034d3774b2654aa9c853eb827182839dd5dcd7facbdd0e9baa6601b7df  $RUNNER_TEMP/fix.patch" | sha256sum --check
          git apply --check "$RUNNER_TEMP/fix.patch"
          git apply "$RUNNER_TEMP/fix.patch"
          git diff --check
          for file in tests/*_test.php; do php "$file"; done
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add functions/automation_investigation.php tests/automation_investigation_database_assert.php
          git commit -m 'fix: fence investigation enqueue against deletion and complete CI fixtures'
          git push origin HEAD:refs/heads/codex/read-only-ticket-investigation
