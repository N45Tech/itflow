name: SQL Syntax Check for db.sql

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  syntax_check:
    name: Check db.sql SQL Syntax
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.head.ref == 'next' &&
      github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest

    env:
      N45_CI_DB_HOST: 127.0.0.1
      N45_CI_DB_PORT: '3306'
      N45_CI_DB_USER: root
      N45_CI_DB_PASSWORD: n45-ci-root-password

    services:
      mariadb:
        image: mariadb:11.4
        ports:
        - "3306:3306"
        env:
          MARIADB_ROOT_PASSWORD: n45-ci-root-password
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mysqli
          coverage: none

      - name: Install MariaDB client
        run: |
          sudo apt-get update
          sudo apt-get install --yes mariadb-client

      - name: Check release harness syntax
        run: |
          bash -n tests/n45_release_database_test.sh
          bash -n tests/n45_lock_order_database_test.sh

      - name: Validate generated n8n workflows
        run: |
          node deploy/n8n/build-workflows.mjs
          node deploy/n8n/test-workflows.mjs
          git diff --exit-code -- deploy/n8n/workflows

      - name: Check PHP syntax errors
        if: github.event_name == 'workflow_dispatch'
        run: |
          set -euo pipefail
          while IFS= read -r -d '' php_file; do
            php -l "$php_file" > /dev/null
          done < <(git ls-files -z '*.php')

      - name: Run PHP regression tests
        run: |
          set -euo pipefail
          failed_tests=()
          for test_file in tests/*_test.php; do
            echo "Running ${test_file}"
            if ! php "${test_file}"; then
              failed_tests+=("${test_file}")
            fi
          done
          if ((${#failed_tests[@]})); then
            printf 'Failed PHP regression tests:\n%s\n' "${failed_tests[@]}"
            exit 1
          fi

      - name: Exercise Field Mode browser recovery
        run: |
          npm install --prefix "$RUNNER_TEMP/n45-field-browser" --no-save --ignore-scripts playwright@1.62.1
          "$RUNNER_TEMP/n45-field-browser/node_modules/.bin/playwright" install --with-deps chromium
          NODE_PATH="$RUNNER_TEMP/n45-field-browser/node_modules" node tests/field/browser.cjs

      - name: Validate final schema and N45 upgrade path
        env:
          MYSQL_PWD: n45-ci-root-password
        run: bash tests/n45_release_database_test.sh

      - name: Exercise canonical database lock order
        env:
          MYSQL_PWD: n45-ci-root-password
        run: bash tests/n45_lock_order_database_test.sh
