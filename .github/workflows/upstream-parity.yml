name: N45 Upstream Parity

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      reviewed_base_sha:
        description: Exact upstream SHA reviewed for security-sensitive overlaps
        required: false
        type: string
      reviewed_head_sha:
        description: Exact fork SHA reviewed for security-sensitive overlaps
        required: false
        type: string
  schedule:
    - cron: '17 12 * * 1'

permissions:
  contents: read

jobs:
  review:
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.head.ref == 'next' &&
      github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - name: Fetch authoritative ITFlow upstream
        run: git fetch --no-tags https://github.com/itflow-org/itflow.git master:refs/remotes/upstream/master

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.3'
          extensions: mysqli
          coverage: none

      - name: Validate review tooling
        run: bash -n scripts/n45-upstream-review.sh

      - name: Generate upstream parity report
        if: always()
        env:
          CONFIGURED_REVIEWED_BASE_SHA: ${{ inputs.reviewed_base_sha || vars.N45_REVIEWED_BASE_SHA }}
          CONFIGURED_REVIEWED_HEAD_SHA: ${{ inputs.reviewed_head_sha || vars.N45_REVIEWED_HEAD_SHA }}
        run: |
          set -euo pipefail
          N45_REVIEWED_BASE_SHA="$CONFIGURED_REVIEWED_BASE_SHA" \
          N45_REVIEWED_HEAD_SHA="$CONFIGURED_REVIEWED_HEAD_SHA" \
            bash scripts/n45-upstream-review.sh upstream/master HEAD upstream-parity-report.md

      - name: Publish job summary
        if: always()
        run: |
          if [ -f upstream-parity-report.md ]; then
            cat upstream-parity-report.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload parity report
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: n45-upstream-parity
          path: upstream-parity-report.md
          if-no-files-found: error
