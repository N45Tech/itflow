name: N45 PHP Static Analysis

on:
  workflow_dispatch:
  pull_request:
    branches:
      - next

permissions:
  contents: read

jobs:
  phpstan:
    name: PHPStan governed core
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up PHPStan
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.3'
          extensions: mysqli, intl, mbstring, dom
          coverage: none
          tools: phpstan:2.2.14
        env:
          fail-fast: true

      - name: Analyse governed N45 PHP core
        run: phpstan analyse --configuration=phpstan.neon.dist --no-progress --error-format=github

  javascript-shell:
    name: JavaScript and shell static analysis
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up pinned Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.19.0'
          cache: npm

      - name: Install locked lint dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Analyse application JavaScript
        run: npm run lint:js

      - name: Install checksum-pinned ShellCheck
        run: |
          set -euo pipefail
          shellcheck_archive="$RUNNER_TEMP/shellcheck-v0.10.0.tar.xz"
          curl --fail --location --silent --show-error --retry 2 --max-time 60 \
            https://github.com/koalaman/shellcheck/releases/download/v0.10.0/shellcheck-v0.10.0.linux.x86_64.tar.xz \
            --output "$shellcheck_archive"
          printf '%s  %s\n' \
            6c881ab0698e4e6ea235245f22832860544f17ba386442fe7e9d629f8cbedf87 \
            "$shellcheck_archive" | sha256sum --check --strict
          tar --no-same-owner -xJf "$shellcheck_archive" -C "$RUNNER_TEMP"
          "$RUNNER_TEMP/shellcheck-v0.10.0/shellcheck" --version | grep -Fx 'version: 0.10.0'
          echo "$RUNNER_TEMP/shellcheck-v0.10.0" >> "$GITHUB_PATH"

      - name: Analyse deployment and acceptance shell scripts
        run: npm run lint:shell
