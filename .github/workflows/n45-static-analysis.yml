name: N45 PHP Static Analysis

on:
  workflow_dispatch:
  pull_request:
    branches:
      - next

permissions:
  contents: read

jobs:
  phpstan:
    name: PHPStan governed core
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up PHPStan
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.3'
          extensions: mysqli, intl, mbstring, dom
          coverage: none
          tools: phpstan:2.2.14
        env:
          fail-fast: true

      - name: Analyse governed N45 PHP core
        run: phpstan analyse --configuration=phpstan.neon.dist --no-progress --error-format=github
